<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f2027;
  color: white;
}

header {
  background: #111;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.logout {
  background: #ff5252;
  color: white;
}

.container {
  display: flex;
  justify-content: center;
  margin-top: 40px;
}

.card {
  width: 600px;
  background: rgba(255,255,255,0.08);
  padding: 25px;
  border-radius: 14px;
}

input {
  width: 100%;
  padding: 8px;
  margin: 6px 0;
  border-radius: 6px;
  border: none;
}

.add-btn {
  width: 100%;
  background: #00e5ff;
  margin-top: 10px;
}

table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #555;
  text-align: left;
}

.edit {
  background: #ffc107;
}

.delete {
  background: #f44336;
  color: white;
}
</style>
</head>

<body>

<header>
  <div>📦 Product Dashboard</div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">
  <div class="card">

    <h3>Add / Update Product</h3>
    <input id="productName" placeholder="Product name">
    <input id="productPrice" type="number" placeholder="Price">


    <button class="add-btn" onclick="saveProduct()">Save</button>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Price</th>
          <th width="140">Action</th>
        </tr>
      </thead>
      <tbody id="productList"></tbody>
    </table>

  </div>
</div>

<script>
const supabaseClient = supabase.createClient(
  'https://myapi.g4poc.com',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsd2ZpYWZmZGJ0dmFtbXNxZmNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NzIzMDUsImV4cCI6MjA4MzM0ODMwNX0.m3h7Smp6CiPX2fEzthZD3_0LhDzsm_kQp2Jbqzm8_r8'
);

let editId = null;

/* AUTH GUARD */
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) location.href = "index.html";
  loadProducts();
})();

/* LOAD */
async function loadProducts() {
  const { data } = await supabaseClient
    .from('products')
    .select()
    .order('created_at', { ascending: false });

  productList.innerHTML = "";
  data.forEach(p => {
    productList.innerHTML += `
<tr>
  <td>${p.name}</td>
  <td>${p.price}</td>
  <td>
    <button class="edit" onclick="editProduct('${p.id}', '${p.name}', ${p.price})">✏️</button>
    <button class="delete" onclick="deleteProduct('${p.id}')">🗑️</button>
  </td>
</tr>
`;

  });
}

/* SAVE (ADD / UPDATE) */
async function saveProduct() {
  console.log("SAVE MODE editId =", editId);

  const nameInput = document.getElementById("productName");
  const priceInput = document.getElementById("productPrice");

  const nameVal = nameInput.value.trim();
  const priceVal = priceInput.value;

  if (nameVal === "" || priceVal === "") {
    alert("Please fill all fields");
    return;
  }

  let result;

  if (editId !== null) {
    // 🔄 UPDATE
    result = await supabaseClient
      .from("products")
      .update({
        name: nameVal,
        price: Number(priceVal)
      })
      .eq("id", editId);
  } else {
    // ➕ INSERT
    result = await supabaseClient
      .from("products")
      .insert([
        {
          name: nameVal,
          price: Number(priceVal)
        }
      ]);
  }

  if (result.error) {
    alert(result.error.message);
    return;
  }

  editId = null; // 🔥 reset หลัง save
  nameInput.value = "";
  priceInput.value = "";

  loadProducts();
}




/* EDIT */
function editProduct(id, nameVal, priceVal) {
  editId = id; // 🔥 ตัว global

  document.getElementById("productName").value = nameVal;
  document.getElementById("productPrice").value = priceVal;

  console.log("EDIT MODE:", editId);
}



/* DELETE */
async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;

  await supabaseClient
    .from('products')
    .delete()
    .eq('id', id);

  loadProducts();
}

/* LOGOUT */
async function logout() {
  await supabaseClient.auth.signOut();
  location.href = "index.html";
}
</script>

</body>
</html>
