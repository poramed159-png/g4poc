<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f2027;
  color: white;
}

header {
  background: #111;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  background: #ff5252;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

main {
  padding: 30px;
}

#loading {
  padding: 50px;
  text-align: center;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="loading">Loading...</div>

<div id="app" style="display:none">
  <header>
    <div>MyApp Dashboard</div>
    <button onclick="logout()">Logout</button>
  </header>

  <main>
    <h2>Welcome 👋</h2>
    <p id="email"></p>
  </main>
</div>

<script>
const supabaseClient = supabase.createClient(
  'https://ylwfiaffdbtvammsqfcp.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsd2ZpYWZmZGJ0dmFtbXNxZmNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NzIzMDUsImV4cCI6MjA4MzM0ODMwNX0.m3h7Smp6CiPX2fEzthZD3_0LhDzsm_kQp2Jbqzm8_r8'
);

let initialized = false;

/* ✅ AUTH STATE LISTENER (สำคัญที่สุด) */
supabaseClient.auth.onAuthStateChange((event, session) => {

  // รอ event แรกเท่านั้น
  if (!initialized) {
    initialized = true;

    if (!session) {
      window.location.href = "index.html";
      return;
    }

    // login แล้วจริง
    document.getElementById("email").innerText =
      "Logged in as: " + session.user.email;

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";
  }
});

/* 🚪 LOGOUT */
async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = "index.html";
}
</script>

</body>
</html>
