<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Application : Login / Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  font-family: Arial, sans-serif;
  color: white;
}

.box {
  width: 380px;
  background: rgba(255,255,255,0.08);
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.logo {
  text-align: center;
  margin-bottom: 15px;
}

.logo img {
  width: 80px;
  margin-bottom: 10px;
}

.logo h2 {
  margin: 5px 0;
}

.subtitle {
  font-size: 13px;
  color: #cfd8dc;
}

.tabs {
  display: flex;
  margin: 20px 0;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 10px;
  cursor: pointer;
  border-bottom: 2px solid #555;
}

.tab.active {
  border-bottom: 2px solid #00e5ff;
  color: #00e5ff;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 6px;
  border: none;
  outline: none;
}

button {
  width: 100%;
  padding: 11px;
  margin-top: 12px;
  border: none;
  border-radius: 6px;
  background: #00e5ff;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #00c4d6;
}

.hidden { display: none; }

.msg {
  margin-top: 12px;
  text-align: center;
  font-size: 14px;
  color: #ffcc80;
}
</style>
</head>

<body>

<div class="box">

  <!-- LOGO / IMAGE -->
  <div class="logo">
    <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="auth">
    <h2 id="title">Login</h2>
    <div class="subtitle">Front-end for testing authentication and test api to backend. if anyone want to attack. please...</div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="setMode('login')">Login</div>
    <div class="tab" id="registerTab" onclick="setMode('register')">Register</div>
  </div>

  <!-- LOGIN -->
  <div id="loginBox">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
  </div>

  <!-- REGISTER -->
  <div id="registerBox" class="hidden">
    <input id="regEmail" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password (min 6)">
  </div>

  <button id="actionBtn" onclick="submitForm()">Login</button>
  <div class="msg" id="msg"></div>

</div>

<script>
const supabaseClient = supabase.createClient(
  'https://myapi.g4poc.com',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsd2ZpYWZmZGJ0dmFtbXNxZmNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NzIzMDUsImV4cCI6MjA4MzM0ODMwNX0.m3h7Smp6CiPX2fEzthZD3_0LhDzsm_kQp2Jbqzm8_r8'
);

let mode = "login";

function setMode(m) {
  mode = m;
  msg.innerText = "";

  if (mode === "login") {
    loginBox.classList.remove("hidden");
    registerBox.classList.add("hidden");
    loginTab.classList.add("active");
    registerTab.classList.remove("active");
    title.innerText = "Login";
    actionBtn.innerText = "Login";
  } else {
    registerBox.classList.remove("hidden");
    loginBox.classList.add("hidden");
    registerTab.classList.add("active");
    loginTab.classList.remove("active");
    title.innerText = "Register";
    actionBtn.innerText = "Register";
  }
}

async function submitForm() {
  if (mode === "login") {
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: loginEmail.value,
      password: loginPassword.value
    });

    if (error) msg.innerText = error.message;
    else location.href = "Welcome.html";

  } else {
    const { error } = await supabaseClient.auth.signUp({
      email: regEmail.value,
      password: regPassword.value
    });

    if (error) msg.innerText = error.message;
    else {
      msg.innerText = "สมัครสำเร็จ กรุณายืนยันอีเมล";
      setMode("login");
    }
  }
}
</script>

</body>
</html>
