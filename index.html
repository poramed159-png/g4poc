<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login / Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f2027;
  font-family: Arial, sans-serif;
  color: white;
}

.box {
  width: 360px;
  background: rgba(255,255,255,0.08);
  padding: 30px;
  border-radius: 12px;
}

.tabs {
  display: flex;
  margin-bottom: 20px;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 10px;
  cursor: pointer;
  border-bottom: 2px solid #555;
}

.tab.active {
  border-bottom: 2px solid #00e5ff;
  color: #00e5ff;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 6px;
  border: none;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  background: #00e5ff;
  font-weight: bold;
  cursor: pointer;
}

.hidden { display: none; }

.msg {
  margin-top: 10px;
  text-align: center;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="box">

  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="setMode('login')">Login</div>
    <div class="tab" id="registerTab" onclick="setMode('register')">Register</div>
  </div>

  <h3 id="title">Login</h3>

  <div id="loginBox">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
  </div>

  <div id="registerBox" class="hidden">
    <input id="regEmail" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password (min 6)">
  </div>

  <button id="actionBtn" onclick="submitForm()">Login</button>
  <div class="msg" id="msg"></div>

</div>

<script>
const supabaseClient = supabase.createClient(
  'https://ylwfiaffdbtvammsqfcp.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsd2ZpYWZmZGJ0dmFtbXNxZmNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NzIzMDUsImV4cCI6MjA4MzM0ODMwNX0.m3h7Smp6CiPX2fEzthZD3_0LhDzsm_kQp2Jbqzm8_r8'
);

let mode = "login";

function setMode(m) {
  mode = m;
  document.getElementById("msg").innerText = "";

  if (mode === "login") {
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("registerBox").classList.add("hidden");
    document.getElementById("loginTab").classList.add("active");
    document.getElementById("registerTab").classList.remove("active");
    document.getElementById("title").innerText = "Login";
    document.getElementById("actionBtn").innerText = "Login";
  } else {
    document.getElementById("registerBox").classList.remove("hidden");
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("registerTab").classList.add("active");
    document.getElementById("loginTab").classList.remove("active");
    document.getElementById("title").innerText = "Register";
    document.getElementById("actionBtn").innerText = "Register";
  }
}

async function submitForm() {
  if (mode === "login") {
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: loginEmail.value,
      password: loginPassword.value
    });
    if (error) msg.innerText = error.message;
    else location.href = "dashboard.html";
  } else {
    const { error } = await supabaseClient.auth.signUp({
      email: regEmail.value,
      password: regPassword.value
    });
    if (error) msg.innerText = error.message;
    else {
      msg.innerText = "สมัครสำเร็จ กรุณายืนยันอีเมล";
      setMode("login");
    }
  }
}
</script>

</body>
</html>
