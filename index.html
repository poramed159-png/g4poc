<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyApp – Login / Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: Inter, sans-serif;
      background: radial-gradient(circle at top left, #1a2a6c, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      display: flex;
      width: 900px;
      max-width: 95%;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }

    .left {
      flex: 1;
      padding: 3rem;
      background: linear-gradient(135deg, #0070f3, #00c8b4);
    }

    .right {
      width: 380px;
      padding: 2.5rem;
      background: rgba(0,0,0,0.55);
    }

    h2 {
      text-align: center;
      margin-bottom: 1.2rem;
    }

    .tabs {
      display: flex;
      margin-bottom: 1.2rem;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 0.7rem;
      cursor: pointer;
      border-bottom: 2px solid rgba(255,255,255,0.2);
      color: #aaa;
    }

    .tab.active {
      border-bottom: 2px solid #00e5ff;
      color: #00e5ff;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.6rem 0;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    button {
      width: 100%;
      padding: 0.9rem;
      margin-top: 1rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00e5ff, #00bfa5);
      color: #000;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .msg {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }

    .hidden { display: none; }

    @media (max-width: 768px) {
      .left { display: none; }
      .right { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="left">
    <h1>Welcome</h1>
    <p>Secure login powered by Supabase</p>
  </div>

  <div class="right">

    <h2 id="formTitle">Login</h2>

    <div class="tabs">
      <div class="tab active" id="loginTab">Login</div>
      <div class="tab" id="registerTab">Register</div>
    </div>

    <div id="loginBox">
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
    </div>

    <div id="registerBox" class="hidden">
      <input type="email" id="regEmail" placeholder="Email">
      <input type="password" id="regPassword" placeholder="Password (min 6 chars)">
    </div>

    <button id="actionBtn">Login</button>
    <div class="msg" id="message"></div>

  </div>
</div>

<script>
  // 🔑 ใส่ค่าของคุณตรงนี้
  const supabaseClient = supabase.createClient(
    'https://ylwfiaffdbtvammsqfcp.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsd2ZpYWZmZGJ0dmFtbXNxZmNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NzIzMDUsImV4cCI6MjA4MzM0ODMwNX0.m3h7Smp6CiPX2fEzthZD3_0LhDzsm_kQp2Jbqzm8_r8'
  );

  let mode = "login";

  const loginTab = document.getElementById("loginTab");
  const registerTab = document.getElementById("registerTab");
  const loginBox = document.getElementById("loginBox");
  const registerBox = document.getElementById("registerBox");
  const formTitle = document.getElementById("formTitle");
  const actionBtn = document.getElementById("actionBtn");
  const message = document.getElementById("message");

  loginTab.onclick = () => setMode("login");
  registerTab.onclick = () => setMode("register");
  actionBtn.onclick = submitForm;

  function setMode(newMode) {
    mode = newMode;
    message.innerText = "";

    if (mode === "login") {
      loginBox.classList.remove("hidden");
      registerBox.classList.add("hidden");
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
      formTitle.innerText = "Login";
      actionBtn.innerText = "Login";
    } else {
      registerBox.classList.remove("hidden");
      loginBox.classList.add("hidden");
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
      formTitle.innerText = "Create Account";
      actionBtn.innerText = "Register";
    }
  }

  function showMsg(text, isError = false) {
    message.innerText = text;
    message.style.color = isError ? "#ff6b6b" : "#00e676";
  }

  async function submitForm() {
    if (mode === "login") {
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: loginEmail.value,
        password: loginPassword.value
      });

      if (error) showMsg(error.message, true);
      else window.location.href = "dashboard.html";

    } else {
      const { error } = await supabaseClient.auth.signUp({
        email: regEmail.value,
        password: regPassword.value
      });

      if (error) showMsg(error.message, true);
      else {
        showMsg("สมัครสำเร็จ กรุณายืนยันอีเมล");
        setMode("login");
      }
    }
  }
</script>

</body>
</html>
