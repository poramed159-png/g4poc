<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyApp – Secure Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #1a2a6c, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      display: flex;
      width: 900px;
      max-width: 95%;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }

    /* LEFT */
    .left {
      flex: 1;
      padding: 3rem;
      background: linear-gradient(135deg, rgba(0,112,243,0.8), rgba(0,200,180,0.7));
    }

    .left h1 {
      font-size: 2.4rem;
      margin: 0 0 1rem;
    }

    .left p {
      font-size: 1.1rem;
      opacity: 0.9;
      line-height: 1.6;
    }

    /* RIGHT */
    .right {
      width: 380px;
      background: rgba(0,0,0,0.5);
      padding: 2.5rem;
    }

    .tabs {
      display: flex;
      margin-bottom: 1.5rem;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 0.7rem;
      cursor: pointer;
      border-bottom: 2px solid rgba(255,255,255,0.2);
      color: #aaa;
      transition: 0.3s;
    }

    .tab.active {
      border-bottom: 2px solid #00e5ff;
      color: #00e5ff;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.6rem 0;
      border-radius: 8px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 1rem;
    }

    input::placeholder {
      color: #bbb;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      margin-top: 1rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00e5ff, #00bfa5);
      color: #000;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      opacity: 0.85;
    }

    .msg {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .left {
        display: none;
      }
      .right {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="left">
    <h1>Welcome to MyApp</h1>
    <p>
      Secure platform powered by Supabase.<br>
      Login or create an account to continue.
    </p>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">

    <div class="tabs">
      <div class="tab active" id="loginTab" onclick="showLogin()">Login</div>
      <div class="tab" id="registerTab" onclick="showRegister()">Register</div>
    </div>

    <!-- LOGIN -->
    <div id="loginBox">
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="login()">Login</button>
    </div>

    <!-- REGISTER -->
    <div id="registerBox" class="hidden">
      <input type="email" id="regEmail" placeholder="Email">
      <input type="password" id="regPassword" placeholder="Password">
      <button onclick="register()">Create Account</button>
    </div>

    <div class="msg" id="message"></div>

  </div>
</div>

<script>
  const supabase = supabase.createClient(
    'https://ylwfiaffdbtvammsqfcp.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsd2ZpYWZmZGJ0dmFtbXNxZmNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NzIzMDUsImV4cCI6MjA4MzM0ODMwNX0.m3h7Smp6CiPX2fEzthZD3_0LhDzsm_kQp2Jbqzm8_r8'
  );

  function showLogin() {
    loginBox.classList.remove("hidden");
    registerBox.classList.add("hidden");
    loginTab.classList.add("active");
    registerTab.classList.remove("active");
    setMsg("");
  }

  function showRegister() {
    registerBox.classList.remove("hidden");
    loginBox.classList.add("hidden");
    registerTab.classList.add("active");
    loginTab.classList.remove("active");
    setMsg("");
  }

  function setMsg(text, error = false) {
    const el = document.getElementById("message");
    el.innerText = text;
    el.style.color = error ? "#ff6b6b" : "#00e676";
  }

  async function login() {
    const { error } = await supabase.auth.signInWithPassword({
      email: loginEmail.value,
      password: loginPassword.value
    });

    if (error) setMsg(error.message, true);
    else window.location.href = "dashboard.html";
  }

  async function register() {
    const { error } = await supabase.auth.signUp({
      email: regEmail.value,
      password: regPassword.value
    });

    if (error) setMsg(error.message, true);
    else {
      setMsg("Account created. Please verify your email.");
      showLogin();
    }
  }
</script>

</body>
</html>
